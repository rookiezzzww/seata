server:
  port: 8083
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/seata_test?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.141.130:8848
seata:
  registry: #定义了Seata Server的注册中心配置, 微服务根据配置信息去注册中心获取tc服务地址
    type: nacos #指定注册中心的类型
    nacos:
      application: seata-server #Seata Server在Nacos中的应⽤名称
      server-addr: 192.168.141.130:8848 #Nacos服务器地址
      group: "SEATA_GROUP" #Seata Server在Nacos中的分组名称
      namespace: "" #Nacos的命名空间, 设置为空, 表⽰使⽤默认的命名空间public
  tx-service-group: default_tx_group #定义事务服务组的名称
  service:
    vgroup-mapping:
      default_tx_group: default
  data-source-proxy-mode: AT #seata事务模式,AT模式为添加了undo_log表和全局锁
#  data-source-proxy-mode: XA #seata事务模式,XA模式为XA协议支持的二阶段提交
logging:
  pattern:
    dateformat: HH:mm:ss:SSS
